# Cheap head-only ablation (retains fully frozen BLIP cross-modal encoder).
blip_model: Salesforce/blip-itm-base-coco
clip_model: openai/clip-vit-base-patch32
clip_index: artifacts/flickr8k_visual_multi_index.npz
clip_adapter: artifacts/flickr8k_visual_multi/adapter.pt
data_csv: data/flickr8k/captions_official.csv
image_root: data/flickr8k/Images
output_dir: artifacts/flickr8k_blip_itm_head_only
seed: 42
anchors_per_epoch: 1200
hard_negative_fraction: 0.80
candidate_pool: 50
near_duplicate_jaccard: 0.85
train_last_text_layers: 0
learning_rate: 0.00002
weight_decay: 0.01
batch_size: 4
grad_accum_steps: 2
max_text_length: 35
amp: auto
max_grad_norm: 1.0
epochs: 3
early_stopping_patience: 2
min_delta: 0.0001
val_sample_text_queries: 250
val_sample_image_queries: 80
val_query_seed: 2026
val_blip_batch_size: 4
save_pair_tables: true
